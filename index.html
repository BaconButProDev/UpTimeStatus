<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #050505;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(20, 20, 20, 0.8);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            width: 320px;
        }

        h1 {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .server-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            background: linear-gradient(90deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 16px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            transition: all 0.5s ease;
        }

        #status-text {
            font-weight: 600;
            font-size: 1.1rem;
            text-transform: capitalize;
        }

        .status-online { background-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; animation: pulse 1.5s infinite; }
        .status-offline { background-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; }
        .status-starting { background-color: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        .status-checking { background-color: #3498db; box-shadow: 0 0 15px #3498db; }
        .status-error { background-color: #9b59b6; box-shadow: 0 0 15px #9b59b6; }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0.7); }
            70% { transform: scale(1.2); opacity: 0.8; box-shadow: 0 0 0 10px rgba(46, 204, 113, 0); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 0 rgba(46, 204, 113, 0); }
        }

        .text-online { color: #2ecc71; }
        .text-offline { color: #e74c3c; }
        .text-starting { color: #f1c40f; }
        .text-checking { color: #3498db; }
        .text-error { color: #9b59b6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Minecraft Server Name</h1>
        <div class="server-name">Anh Em Say Gex</div>
        
        <div class="status-wrapper">
            <div id="status-dot" class="dot status-checking"></div>
            <span id="status-text" class="text-checking">Checking...</span>
        </div>
    </div>

    <script>
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const apiUrl = 'https://processor-annually-plenty-does.trycloudflare.com/status-server';

        async function updateStatus() {
            try {
                const response = await fetch(apiUrl);
                const data = await response.json();
                const status = data.status;

                statusDot.className = 'dot';
                statusText.className = '';

                switch(status) {
                    case 'Online':
                        statusDot.classList.add('status-online');
                        statusText.classList.add('text-online');
                        break;
                    case 'Offline':
                        statusDot.classList.add('status-offline');
                        statusText.classList.add('text-offline');
                        break;
                    case 'Starting':
                        statusDot.classList.add('status-starting');
                        statusText.classList.add('text-starting');
                        break;
                    case 'Checking':
                        statusDot.classList.add('status-checking');
                        statusText.classList.add('text-checking');
                        break;
                    case 'Error':
                        statusDot.classList.add('status-error');
                        statusText.classList.add('text-error');
                        break;
                    default:
                        statusDot.classList.add('status-offline');
                        statusText.classList.add('text-offline');
                }

                statusText.innerText = status;
            } catch (error) {
                statusDot.className = 'dot status-error';
                statusText.className = 'text-error';
                statusText.innerText = 'Error';
            }
        }

        updateStatus();
        setInterval(updateStatus, 10000);
    </script>
</body>
</html>
