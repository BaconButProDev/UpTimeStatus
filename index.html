<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Server Status</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(30, 30, 60, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(60, 30, 60, 0.2) 0%, transparent 50%);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
        }

        .header {
            text-align: center;
            width: 100%;
        }

        .title {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4a9eff 0%, #00d4ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
            text-shadow: 0 5px 15px rgba(74, 158, 255, 0.2);
            animation: titleGlow 3s ease-in-out infinite alternate;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .status-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2rem;
            width: 100%;
            background: rgba(20, 20, 30, 0.7);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(100, 100, 150, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.5s ease;
        }

        .status-container:hover {
            transform: translateY(-5px);
        }

        .status-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #4a9eff, transparent);
            animation: slide 3s infinite;
        }

        .server-name {
            font-size: 2rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(100, 100, 150, 0.3);
            width: 100%;
        }

        .status-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .status-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 0 20px currentColor;
            animation: pulse 2s infinite ease-in-out;
        }

        .status-text {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .status-dot::after {
            content: '';
            position: absolute;
            top: -5px;
            left: -5px;
            right: -5px;
            bottom: -5px;
            border-radius: 50%;
            border: 2px solid currentColor;
            opacity: 0.5;
            animation: ripple 2s infinite ease-in-out;
        }

        .status-desc {
            font-size: 1.1rem;
            color: #aaa;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        .timestamp {
            font-size: 0.9rem;
            color: #777;
            text-align: center;
            margin-top: 1rem;
        }

        .refresh-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
            font-size: 0.9rem;
            margin-top: 1rem;
        }

        .refresh-icon {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #4a9eff;
            position: relative;
        }

        .refresh-icon::after {
            content: '';
            position: absolute;
            top: -3px;
            right: -3px;
            width: 10px;
            height: 10px;
            border-top: 2px solid #4a9eff;
            border-right: 2px solid #4a9eff;
            border-radius: 0 10px 0 0;
        }

        .background-animation {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .cube {
            position: absolute;
            background: rgba(74, 158, 255, 0.05);
            border: 1px solid rgba(74, 158, 255, 0.1);
            animation: float 15s infinite linear;
        }

        .cube:nth-child(1) {
            width: 40px;
            height: 40px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            animation-duration: 20s;
        }

        .cube:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 70%;
            left: 80%;
            animation-delay: -5s;
            animation-duration: 25s;
        }

        .cube:nth-child(3) {
            width: 30px;
            height: 30px;
            top: 50%;
            left: 20%;
            animation-delay: -10s;
            animation-duration: 15s;
        }

        .cube:nth-child(4) {
            width: 50px;
            height: 50px;
            top: 20%;
            left: 85%;
            animation-delay: -15s;
        }

        /* Status Colors */
        .status-online {
            color: #00ff00;
        }

        .status-offline {
            color: #ff0000;
        }

        .status-starting {
            color: #ffff00;
        }

        .status-checking {
            color: #0000ff;
        }

        .status-error {
            color: #800080;
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 20px currentColor;
            }
            50% {
                transform: scale(1.1);
                box-shadow: 0 0 30px currentColor;
            }
        }

        @keyframes ripple {
            0%, 100% {
                transform: scale(1);
                opacity: 0.5;
            }
            50% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 5px 15px rgba(74, 158, 255, 0.2);
            }
            100% {
                text-shadow: 0 5px 25px rgba(74, 158, 255, 0.5), 0 0 40px rgba(74, 158, 255, 0.3);
            }
        }

        @keyframes slide {
            0% {
                left: -100%;
            }
            100% {
                left: 100%;
            }
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
            }
            100% {
                transform: translateY(-1000px) rotate(720deg);
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .title {
                font-size: 2.2rem;
            }

            .status-container {
                padding: 1.5rem;
            }

            .server-name {
                font-size: 1.6rem;
            }

            .status-text {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-animation">
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
        <div class="cube"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1 class="title">Anh Em Say Gex</h1>
            <div class="subtitle">Minecraft Server Status</div>
        </div>

        <div class="status-container">
            <div class="server-name">Minecraft Server Name</div>
            
            <div class="status-display">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <div class="status-text" id="statusText">Checking</div>
                </div>
                
                <div class="status-desc" id="statusDesc">
                    Fetching server status information...
                </div>
                
                <div class="timestamp" id="timestamp">
                    Last updated: --
                </div>
                
                <div class="refresh-info">
                    <div class="refresh-icon"></div>
                    <span>Auto-refresh every 5 seconds</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const statusDesc = document.getElementById('statusDesc');
        const timestamp = document.getElementById('timestamp');
        const API_URL = 'https://processor-annually-plenty-does.trycloudflare.com/status-server';

        const statusConfig = {
            'Online': {
                colorClass: 'status-online',
                description: 'Server is online and ready for connections.',
                pulseSpeed: '1.5s'
            },
            'Offline': {
                colorClass: 'status-offline',
                description: 'Server is currently offline or unreachable.',
                pulseSpeed: '2s'
            },
            'Starting': {
                colorClass: 'status-starting',
                description: 'Server is starting up, please wait...',
                pulseSpeed: '1s'
            },
            'Checking': {
                colorClass: 'status-checking',
                description: 'Checking server status...',
                pulseSpeed: '1.8s'
            },
            'Error': {
                colorClass: 'status-error',
                description: 'An error occurred while checking server status.',
                pulseSpeed: '2.5s'
            }
        };

        async function fetchServerStatus() {
            try {
                const response = await fetch(API_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                updateStatusDisplay(data);
            } catch (error) {
                console.error('Error fetching server status:', error);
                updateStatusDisplay({
                    status: 'Error',
                    timestamp: new Date().toISOString(),
                    error: error.message
                });
            }
        }

        function updateStatusDisplay(data) {
            const status = data.status || 'Error';
            const config = statusConfig[status] || statusConfig['Error'];
            
            statusDot.className = 'status-dot';
            statusText.className = 'status-text';
            
            statusDot.classList.add(config.colorClass);
            statusText.classList.add(config.colorClass);
            
            statusText.textContent = status;
            statusDesc.textContent = config.description;
            
            const time = data.timestamp ? new Date(data.timestamp) : new Date();
            timestamp.textContent = `Last updated: ${time.toLocaleTimeString()}`;
            
            statusDot.style.animationDuration = config.pulseSpeed;
            
            statusDot.style.transform = 'scale(1.2)';
            setTimeout(() => {
                statusDot.style.transform = 'scale(1)';
            }, 300);
        }

        fetchServerStatus();
        
        setInterval(fetchServerStatus, 5000);
        
        document.querySelector('.status-container').addEventListener('click', () => {
            fetchServerStatus();
            
            const container = document.querySelector('.status-container');
            container.style.transform = 'scale(0.98)';
            setTimeout(() => {
                container.style.transform = '';
            }, 300);
        });
    </script>
</body>
</html>
